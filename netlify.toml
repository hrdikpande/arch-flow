# Netlify builds the web app and runs the API as Next.js server functions.
# The WhatsApp worker does NOT run on Netlify: it runs in Docker on the Hostinger VPS.
[build]
  command = "npm run build -w @arch-flow/domain && npm run build -w @arch-flow/web"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
