name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (domain and messaging)
        run: npm test
      - name: Build (placeholder environment, no secrets needed)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service
          APP_URL: https://arch-flow.example
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build (placeholder environment)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service
          APP_URL: https://arch-flow.example
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Playwright smoke tests
        env:
          CI: "true"
        run: npm run e2e -w @arch-flow/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  api-integration:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: PostgreSQL client and PostgREST
        env:
          POSTGREST_VERSION: 12.2.3
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          curl -sSL -o /tmp/postgrest.tar.xz "https://github.com/PostgREST/postgrest/releases/download/v${POSTGREST_VERSION}/postgrest-v${POSTGREST_VERSION}-linux-static-x64.tar.xz"
          mkdir -p "$HOME/bin" && tar -xJf /tmp/postgrest.tar.xz -C "$HOME/bin" && chmod +x "$HOME/bin/postgrest"
      - run: npm ci
      - name: Browser for the signed-in tests
        run: npx playwright install --with-deps chromium
      - name: Local stack and integration tests
        env:
          CI: "true"
          ARCHFLOW_SIGNED_IN: "1"
        run: POSTGREST_BIN="$HOME/bin/postgrest" bash supabase/tests/api/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-in-results
          path: apps/web/test-results/signed-in
